// Подписи типов ссылок. Новый kind можно просто использовать в данных —
// если его здесь нет, подписью станет само значение kind.
const KINDS = {
  embed:  { label: "Просмотр", hint: "первая загрузка 20–40 с" },
  demo:   { label: "Демо",   hint: "новая вкладка, первая загрузка 20–40 с" },
  code:   { label: "Код"    },
  report: { label: "Отчёт"  },
  slides: { label: "Слайды" },
  data:   { label: "Данные" },
  video:  { label: "Видео"  },
  file:   { label: "Файл"   }
};

const TODO = "#TODO";

function esc(v){
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function isSoon(url){
  return !url || String(url).trim().indexOf(TODO) === 0;
}

function safeUrl(url){
  const u = String(url).trim();
  return /^\s*(javascript|data|vbscript):/i.test(u) ? "#" : u;
}

function kindOf(kind){
  const k = KINDS[kind];
  return { label: (k && k.label) || kind || "Ссылка", hint: (k && k.hint) || "" };
}

function linkHtml(link, cardIndex, linkIndex){
  const k = kindOf(link.kind);
  const txt = link.txt || k.label;
  // если подпись совпадает с названием типа — тип не дублируем
  const same = String(txt).toLowerCase().indexOf(String(k.label).toLowerCase()) === 0;
  const kindTag = same ? "" : '<span class="btn__kind">' + esc(k.label) + '</span>';
  const label = '<span>' + esc(txt) + '</span>';

  if (isSoon(link.url)){
    return '<span class="btn btn--soon" aria-disabled="true">' + kindTag + label +
           '<span class="btn__hint">скоро</span></span>';
  }

  const hintTxt = (link.hint === undefined) ? k.hint : link.hint;
  const hint = hintTxt ? '<span class="btn__hint">' + esc(hintTxt) + '</span>' : "";

  if (link.kind === "embed"){
    const id = "embed-" + cardIndex + "-" + linkIndex;
    return '<button type="button" class="btn" data-embed="' + id + '" ' +
           'data-src="' + esc(safeUrl(link.url)) + '" aria-expanded="false" aria-controls="' + id + '">' +
           kindTag + label + hint + '</button>';
  }

  return '<a class="btn" href="' + esc(safeUrl(link.url)) + '" target="_blank" rel="noopener">' +
         kindTag + label + hint + '</a>';
}

function embedSlotHtml(link, cardIndex, linkIndex){
  if (link.kind !== "embed" || isSoon(link.url)) return "";
  const id = "embed-" + cardIndex + "-" + linkIndex;
  return '<div class="embed" id="' + id + '" hidden>' +
           '<div class="embed__bar">Приложение загружается на бесплатном хостинге — первый заход занимает 20–40 секунд</div>' +
           '<iframe title="' + esc(link.txt || "Демо") + '" loading="lazy" allowfullscreen></iframe>' +
         '</div>';
}

function cardHtml(p, i){
  const num = String(i + 1).padStart(2, "0");
  const links = Array.isArray(p.links) ? p.links : [];
  let h = "";

  h += '<article class="card" data-tags="' + esc((p.tags || []).join("|")) + '">';
  h +=   '<div class="card__num">' + num + '</div>';
  h +=   '<div class="card__body">';
  if (p.meta)    h += '<p class="card__meta">' + esc(p.meta) + '</p>';
  if (p.title)   h += '<h2 class="card__title">' + esc(p.title) + '</h2>';
  if (p.tagline) h += '<p class="card__tagline">' + esc(p.tagline) + '</p>';
  if (p.result)  h += '<div class="card__result"><b>Результат</b>' + esc(p.result) + '</div>';
  if (p.note)    h += '<p class="card__note">' + esc(p.note) + '</p>';
  if (p.cover)   h += '<figure class="card__cover"><img src="' + esc(safeUrl(p.cover)) + '" alt="Скриншот проекта: ' + esc(p.title) + '" loading="lazy" decoding="async"></figure>';
  if (links.length){
    h += '<div class="links">';
    links.forEach(function(l, j){ h += linkHtml(l, i, j); });
    h += '</div>';
    links.forEach(function(l, j){ h += embedSlotHtml(l, i, j); });
  }
  h +=   '</div>';
  h += '</article>';
  return h;
}

// --- отрисовка ---
const projectsEl = document.getElementById("projects");
projectsEl.innerHTML = PROJECTS.map(cardHtml).join("");

document.getElementById("updated").textContent = "Обновлено: " + UPDATED;

document.getElementById("contacts").innerHTML = CONTACTS.map(function(c){
  if (isSoon(c.url)) return '<li><span class="off">' + esc(c.txt) + ' — скоро</span></li>';
  const ext = /^mailto:/i.test(c.url) ? "" : ' target="_blank" rel="noopener"';
  return '<li><a href="' + esc(safeUrl(c.url)) + '"' + ext + '>' + esc(c.txt) + '</a></li>';
}).join("");

// --- фильтр по тегам ---
const tags = [];
PROJECTS.forEach(function(p){
  (p.tags || []).forEach(function(t){ if (t && tags.indexOf(t) === -1) tags.push(t); });
});

const filterEl = document.getElementById("filter");
filterEl.insertAdjacentHTML("beforeend",
  ['Все'].concat(tags).map(function(t, i){
    return '<button type="button" class="chip" data-tag="' + esc(i === 0 ? "" : t) + '" aria-pressed="' + (i === 0) + '">' + esc(t) + '</button>';
  }).join("")
);

filterEl.addEventListener("click", function(e){
  const chip = e.target.closest(".chip");
  if (!chip) return;
  const tag = chip.dataset.tag;

  filterEl.querySelectorAll(".chip").forEach(function(c){
    c.setAttribute("aria-pressed", String(c === chip));
  });

  projectsEl.querySelectorAll(".card").forEach(function(card){
    const list = card.dataset.tags ? card.dataset.tags.split("|") : [];
    card.hidden = !!tag && list.indexOf(tag) === -1;
  });
});

// --- разворачивание встроенного демо ---
projectsEl.addEventListener("click", function(e){
  const btn = e.target.closest("[data-embed]");
  if (!btn) return;
  const box = document.getElementById(btn.dataset.embed);
  if (!box) return;

  const open = box.hasAttribute("hidden");
  if (open){
    const frame = box.querySelector("iframe");
    if (frame && !frame.src) frame.src = btn.dataset.src;
    box.removeAttribute("hidden");
  } else {
    box.setAttribute("hidden", "");
  }
  btn.setAttribute("aria-expanded", String(open));
  btn.classList.toggle("btn--on", open);
});
</script>
